# Cadangan untuk menjaga project Supabase (paket gratis) tetap aktif.
# Supabase menghentikan project yang tidak ada aktivitas database selama 7 hari.
# Penjaga utama: Vercel Cron (backend/vercel.json) tiap hari. Ini cadangan tiap 3 hari.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 1 */3 * *" # tiap 3 hari, 01:00 UTC (08:00 WIB)
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Sapa database lewat backend
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://bebaca.vercel.app/api/keepalive
