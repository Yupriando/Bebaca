name: bebaca
description: Aplikasi belajar baca yang menyenangkan.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.0
  shared_preferences: ^2.2.0
  video_player: ^2.9.0
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  audioplayers: ^6.0.0
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/voice/
    - assets/stories/
